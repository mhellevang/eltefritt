<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eltefritt">
  <defs>
    <radialGradient id="loaf" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f0b896"/>
      <stop offset="55%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#a8542f"/>
    </radialGradient>
    <radialGradient id="crust" cx="50%" cy="50%" r="55%">
      <stop offset="80%" stop-color="#7a3f23" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2a1a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Full bleed background for maskable safe area -->
  <rect width="512" height="512" fill="#3a2a1a"/>

  <!-- Loaf scaled smaller so it sits in inner ~70% safe zone -->
  <g transform="translate(256 270) scale(0.72)">
    <ellipse cx="0" cy="14" rx="180" ry="36" fill="#1f1610" opacity="0.45"/>
    <path d="M -170 0
             C -170 -120, -110 -160, 0 -160
             C 110 -160, 170 -120, 170 0
             C 170 60, 110 90, 0 90
             C -110 90, -170 60, -170 0 Z"
          fill="url(#loaf)"/>
    <path d="M -170 0
             C -170 -120, -110 -160, 0 -160
             C 110 -160, 170 -120, 170 0
             C 170 60, 110 90, 0 90
             C -110 90, -170 60, -170 0 Z"
          fill="url(#crust)"/>

    <path d="M -95 -85 Q 0 -120, 95 -75"
          stroke="#3a2a1a" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M -95 -85 Q 0 -120, 95 -75"
          stroke="#f7e3cf" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"
          transform="translate(0 -8)"/>

    <circle cx="-60" cy="-40" r="4" fill="#f7e3cf" opacity="0.7"/>
    <circle cx="40" cy="-20" r="3" fill="#f7e3cf" opacity="0.6"/>
    <circle cx="80" cy="-50" r="3" fill="#f7e3cf" opacity="0.5"/>
    <circle cx="-30" cy="20" r="2.5" fill="#f7e3cf" opacity="0.5"/>
    <circle cx="-100" cy="-30" r="2.5" fill="#f7e3cf" opacity="0.55"/>
  </g>
</svg>
